<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Niels Autotrade Mobile</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0b0e11;
            font-family: sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .header {
            background: #1a1e23;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #33c0ff33;
        }

        .logo {
            font-weight: 900;
            font-size: 1.2rem;
            font-style: italic;
        }

        .logo span {
            color: #33c0ff;
        }

        #pocket-webview {
            flex-grow: 1;
            border: none;
        }

        .status-bar {
            padding: 10px;
            background: #1a1e23;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-capture {
            background: #33c0ff;
            color: #0b0e11;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 900;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>
    <div className="header">
        <div className="logo">NIELS<span>AUTOTRADE</span></div>
        <button id="capture-btn" className="btn-capture">Capture Session</button>
    </div>

    <iframe id="pocket-webview" src="https://pocketoption.com/en/login"
        allow="clipboard-read; clipboard-write"></iframe>

    <div className="status-bar">
        <span id="status-text">Ready to connect...</span>
        <span id="platform-tag">ANDROID AUTO-CAPTURE</span>
    </div>

    <script src="app.js"></script>
</body>

</html>
